    <meta name="theme-color" content="#121212" />

    <meta property="og:title" content="Umair Ahsan | Backend &amp; AI-Integrated Apps Engineer" />

      content="Backend &amp; AI-Integrated Apps Engineer — Spring Boot, Nest.js, PostgreSQL, and LLM-powered products."
    />
    <!-- Absolute URL + JPG: crawlers (LinkedIn, WhatsApp, X) need both; WebP is poorly supported. -->
    <meta property="og:image" content="https://umair-ahsan-portfolio.vercel.app/projects/umair.jpg" />
    <meta property="og:image:alt" content="Portrait of Umair Ahsan" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://umair-ahsan-portfolio.vercel.app/projects/umair.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&family=Open+Sans:wght@300;400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      /* Apply theme before first paint to prevent FOUC */
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#121212' : '#f9fafb');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[var(--color-bg)] text-gray-900 dark:text-[#F5F5F5]">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
